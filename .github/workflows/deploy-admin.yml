name: Deploy Admin App to GitHub Pages

# ★ 2026-09-30 แอปแอดมินย้ายไป Cloudflare Pages หมดแล้ว — ที่นี่เหลือแค่ "หน้าแจ้งย้าย"
#
# ทำไมต้องปิด ไม่ใช่แค่ปล่อยไว้เฉยๆ: ตั้งแต่ config.js เปลี่ยนไปตัดสิน env จาก **hostname** (2026-09-29)
# โดเมน GitHub Pages ไม่มีคำว่า "uat" อยู่เลย ทั้ง /admin/ และ /admin-uat/ จึงถูกตัดสินเป็น 'prod'
# เหมือนกันทั้งคู่ = ใครเปิดลิงก์ "UAT" เก่าที่ค้างในเครื่องจะไป **เขียนข้อมูล production** โดยไม่รู้ตัว
# หน้าแจ้งย้ายไม่โหลด config.js และไม่โหลดตัวแอปเลย จึงแตะ backend ไม่ได้ไม่ว่ากรณีใด
#
# แอปมือถือปิดด้วยแล้ว (เจ้าของระบบยืนยัน 30 ก.ย. 2026 ว่า Endpoint URL ของ LIFF app ทั้งสองตัว
# ใน LINE Developers Console ชี้ไป Cloudflare แล้ว) — /mobile/ กับ /mobile-uat/ เหลือหน้าแจ้งย้ายเหมือนกัน
# ★ ถ้าวันหนึ่งแอปมือถือเปิดไม่ขึ้นแล้วเจอหน้าแจ้งย้ายนี้ แปลว่า Endpoint ถูกตั้งกลับมาที่ GitHub Pages
#   ไม่ใช่แอปพัง — แก้ที่ LINE Developers Console
on:
  push:
    branches: [main, UAT]
    paths: ["frontend-admin/**", "frontend-mobile/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ไม่ต้อง checkout อะไรแล้ว — เว็บนี้สร้างจากสคริปต์ล้วน ไม่ได้เอาโค้ดแอปมาประกอบอีก
      - name: Assemble notice pages
        run: |
          mkdir -p site/admin site/admin-uat
          # แอดมิน: ไม่คัดลอกตัวแอปมาแล้ว — วางหน้าแจ้งย้ายแทน (เหตุผลอยู่หัวไฟล์)
          moved() {   # $1 = โฟลเดอร์ปลายทาง · $2 = URL ใหม่ · $3 = ป้ายสภาพแวดล้อม
            cat > "$1/index.html" <<HTML
          <!doctype html><html lang="th"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>ย้ายที่อยู่แล้ว — Ranger TOPSALES</title>
          <meta http-equiv="refresh" content="3; url=$2">
          <style>
            body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#F6F8FC;color:#1B2C33;
                 margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
            .card{background:#fff;border:1px solid #E4E9F1;border-radius:14px;padding:28px;max-width:520px;
                  box-shadow:0 6px 24px rgba(27,44,51,.07)}
            h1{font-size:19px;margin:0 0 10px} p{line-height:1.7;margin:0 0 12px;font-size:14px}
            .env{display:inline-block;background:#EEF3FF;color:#2B63D9;border-radius:999px;
                 padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
            a.go{display:inline-block;background:#2B63D9;color:#fff;text-decoration:none;font-weight:700;
                 padding:11px 18px;border-radius:9px;margin-top:6px}
            .muted{color:#6B7A85;font-size:12.5px;margin-top:16px}
          </style>
          <div class="card">
            <div class="env">$3</div>
            <h1>แอปย้ายที่อยู่แล้ว</h1>
            <p>ลิงก์เดิมบน GitHub Pages เลิกใช้แล้ว กำลังพาไปที่อยู่ใหม่ใน 3 วินาที…</p>
            <p><a class="go" href="$2">ไปที่แอป &rarr;</a></p>
            <p class="muted"><b>โปรดเปลี่ยนบุ๊กมาร์กเป็นที่อยู่ใหม่</b> — ลิงก์เดิมแยกไม่ออกว่าเป็น UAT
            หรือ Production จึงเข้าฐานข้อมูลจริงทั้งคู่ เลยปิดไว้เพื่อไม่ให้แก้ข้อมูลจริงโดยไม่ตั้งใจ</p>
          </div>
          HTML
          }
          moved site/admin      "https://ranger-topsales-admin.pages.dev/"     "Production"
          moved site/admin-uat  "https://uat.ranger-topsales-admin.pages.dev/" "UAT — สภาพแวดล้อมทดสอบ"
          # แอปมือถือ: ไม่คัดลอกตัวแอปมาแล้วเช่นกัน — หน้าแจ้งย้ายอย่างเดียว
          mkdir -p site/mobile site/mobile-uat
          moved site/mobile      "https://ranger-topsales-mobile.pages.dev/"     "Production"
          moved site/mobile-uat  "https://uat.ranger-topsales-mobile.pages.dev/" "UAT — สภาพแวดล้อมทดสอบ"
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="th"><meta charset="utf-8">
          <title>Ranger TOPSALES — ย้ายที่อยู่แล้ว</title>
          <p>แอปแอดมินย้ายไป Cloudflare Pages แล้ว:</p>
          <p><a href="https://ranger-topsales-admin.pages.dev/">Admin — Production</a></p>
          <p><a href="https://uat.ranger-topsales-admin.pages.dev/">Admin — UAT</a></p>
          <p>แอปมือถือ (LIFF) เปิดผ่าน LINE เท่านั้น — ที่อยู่ใหม่คือ
          <a href="https://ranger-topsales-mobile.pages.dev/">ranger-topsales-mobile.pages.dev</a></p>
          HTML
          # ไม่มีไฟล์นี้ GitHub Pages จะรัน Jekyll ทับ index.html ของเราด้วยหน้า
          # default ที่สร้างจาก README.md เอง (อาการที่เจอ: root ขึ้นหน้า Jekyll
          # ทั้งที่ artifact อัปโหลดถูกไฟล์แล้ว) .nojekyll ปิดพฤติกรรมนี้ทั้งหมด
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
