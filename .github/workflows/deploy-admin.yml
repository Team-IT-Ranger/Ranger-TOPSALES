name: Deploy Admin App to GitHub Pages

# Pages รองรับได้แค่ 1 การ deploy ต่อ repo (ไม่มี multi-branch preview แบบแยก URL ต่อ branch)
# เลยรวมเป็น workflow เดียว เช็คเอาต์ทั้ง main (prod) และ UAT มาประกอบเป็นเว็บเดียว
# แยกกันด้วย path: /admin/ = prod (main), /admin-uat/ = UAT
# แอปมือถือ (LINE LIFF) แพทเทิร์นเดียวกัน: /mobile/ = prod (main), /mobile-uat/ = UAT
# (ใช้เป็น Endpoint URL ของ LIFF app แต่ละตัวใน LINE Developers Console)
on:
  push:
    branches: [main, UAT]
    paths: ["frontend-admin/**", "frontend-mobile/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (prod)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-main

      - name: Checkout UAT
        uses: actions/checkout@v4
        with:
          ref: UAT
          path: src-uat

      - name: Assemble combined site (prod + uat คนละ path)
        run: |
          mkdir -p site/admin site/admin-uat
          cp -r src-main/frontend-admin/. site/admin/
          cp -r src-uat/frontend-admin/. site/admin-uat/
          # แอปมือถือ: ขึ้นเฉพาะ branch ที่มี frontend-mobile/index.html แล้ว (main ก่อน merge มีแค่โฟลเดอร์ _legacy-*)
          # ไม่เอา _legacy-* / README ขึ้นเว็บ — เป็นไฟล์อ้างอิงใน repo เท่านั้น
          for pair in "src-main:mobile" "src-uat:mobile-uat"; do
            src="${pair%%:*}/frontend-mobile"; dst="site/${pair##*:}"
            if [ -f "$src/index.html" ]; then
              mkdir -p "$dst"
              find "$src" -maxdepth 1 -type f ! -name 'README*' -exec cp {} "$dst/" \;
            fi
          done
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <p><a href="./admin/">Admin — Production (main)</a></p>
          <p><a href="./admin-uat/">Admin — UAT</a></p>
          <p><a href="./mobile-uat/">Mobile (LIFF) — UAT</a></p>
          HTML
          # ไม่มีไฟล์นี้ GitHub Pages จะรัน Jekyll ทับ index.html ของเราด้วยหน้า
          # default ที่สร้างจาก README.md เอง (อาการที่เจอ: root ขึ้นหน้า Jekyll
          # ทั้งที่ artifact อัปโหลดถูกไฟล์แล้ว) .nojekyll ปิดพฤติกรรมนี้ทั้งหมด
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
